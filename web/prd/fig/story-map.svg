<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="story-map-title story-map-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="story-map-title">Story map with two release slices</title>
  <desc id="story-map-desc">Five user activities run left to right: set the scene, pick a place, check it works, look inside and make the case. Under them, one slice is built for the demo at 20:00 and a second slice, Next, lists known gaps.</desc>
  <defs>
    <marker id="story-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a96aa"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#0b0f17"/>
  <text x="24" y="24" font-size="16" font-weight="700" fill="#e8edf5">Story map: Rack to the Future</text>
  <text x="24" y="46" font-size="14" fill="#8a96aa">Persona: planner, engineer, judge. Goal: decide where and what to build, and explain it in seconds.</text>
  <line x1="24" y1="64" x2="936" y2="64" stroke="#8a96aa" stroke-width="1.5" marker-end="url(#story-map-arrow)"/>

  <!-- Backbone: activities -->
  <rect x="24" y="76" width="172" height="56" rx="6" fill="#5ad1ff" fill-opacity="0.1" stroke="#5ad1ff"/>
  <text x="110" y="100" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle">Set the scene</text>
  <text x="110" y="120" font-size="14" fill="#8a96aa" text-anchor="middle">preset, year, limits</text>

  <rect x="208" y="76" width="172" height="56" rx="6" fill="#5ad1ff" fill-opacity="0.1" stroke="#5ad1ff"/>
  <text x="294" y="100" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle">Pick a place</text>
  <text x="294" y="120" font-size="14" fill="#8a96aa" text-anchor="middle">fleet, site, orbit</text>

  <rect x="392" y="76" width="172" height="56" rx="6" fill="#5ad1ff" fill-opacity="0.1" stroke="#5ad1ff"/>
  <text x="478" y="100" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle">Check it works</text>
  <text x="478" y="120" font-size="14" fill="#8a96aa" text-anchor="middle">checks and lenses</text>

  <rect x="576" y="76" width="172" height="56" rx="6" fill="#5ad1ff" fill-opacity="0.1" stroke="#5ad1ff"/>
  <text x="662" y="100" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle">Look inside</text>
  <text x="662" y="120" font-size="14" fill="#8a96aa" text-anchor="middle">chip to building</text>

  <rect x="760" y="76" width="172" height="56" rx="6" fill="#5ad1ff" fill-opacity="0.1" stroke="#5ad1ff"/>
  <text x="846" y="100" font-size="16" font-weight="700" fill="#e8edf5" text-anchor="middle">Make the case</text>
  <text x="846" y="120" font-size="14" fill="#8a96aa" text-anchor="middle">money and sources</text>

  <!-- Release 1 band -->
  <rect x="16" y="144" width="928" height="252" rx="8" fill="#5ad1ff" fill-opacity="0.05" stroke="#5ad1ff" stroke-dasharray="6,4"/>
  <text x="28" y="166" font-size="14" font-weight="700" fill="#5ad1ff">RELEASE 1: DEMO AT 20:00</text>

  <!-- Demo row 1 -->
  <rect x="24" y="176" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="34" y="200" font-size="14" fill="#e8edf5">Preset tour</text>
  <text x="34" y="220" font-size="14" fill="#e8edf5">Year slider</text>
  <text x="34" y="240" font-size="14" fill="#e8edf5">Budget, grid sliders</text>
  <text x="34" y="262" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC5, AC7</text>

  <rect x="208" y="176" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="218" y="200" font-size="14" fill="#e8edf5">Globe with six sites</text>
  <text x="218" y="220" font-size="14" fill="#e8edf5">Known AI campuses</text>
  <text x="218" y="240" font-size="14" fill="#e8edf5">Orbit shortcut</text>
  <text x="218" y="262" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC1, AC3, AC11</text>

  <rect x="392" y="176" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="402" y="200" font-size="14" fill="#e8edf5">Six checks in order</text>
  <text x="402" y="220" font-size="14" fill="#e8edf5">First failure in red</text>
  <text x="402" y="240" font-size="14" fill="#e8edf5">Tap to zoom to cause</text>
  <text x="402" y="262" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC6, AC7</text>

  <rect x="576" y="176" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="586" y="200" font-size="14" fill="#e8edf5">Chip, rack, hall,</text>
  <text x="586" y="220" font-size="14" fill="#e8edf5">building, site</text>
  <text x="586" y="240" font-size="14" fill="#e8edf5">Chip workbench</text>
  <text x="586" y="262" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC2, AC14</text>

  <rect x="760" y="176" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="770" y="200" font-size="14" fill="#e8edf5">Break-even price</text>
  <text x="770" y="220" font-size="14" fill="#e8edf5">NPV, IRR, payback</text>
  <text x="770" y="240" font-size="14" fill="#e8edf5">Money-flow chart</text>
  <text x="770" y="262" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC9</text>

  <!-- Demo row 2 -->
  <rect x="392" y="284" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="402" y="308" font-size="14" fill="#e8edf5">Five lenses</text>
  <text x="402" y="328" font-size="14" fill="#e8edf5">Recolour every level</text>
  <text x="402" y="348" font-size="14" fill="#e8edf5">Camera stays put</text>
  <text x="402" y="370" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC4</text>

  <rect x="576" y="284" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="586" y="308" font-size="14" fill="#e8edf5">Vision Pro mode</text>
  <text x="586" y="328" font-size="14" fill="#e8edf5">Pinch to zoom in</text>
  <text x="586" y="348" font-size="14" fill="#e8edf5">In-world panel</text>
  <text x="586" y="370" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC12</text>

  <rect x="760" y="284" width="172" height="96" rx="6" fill="#111722" stroke="#263147"/>
  <text x="770" y="308" font-size="14" fill="#e8edf5">2025 to 2035 chart</text>
  <text x="770" y="328" font-size="14" fill="#e8edf5">Source badge on</text>
  <text x="770" y="348" font-size="14" fill="#e8edf5">every panel number</text>
  <text x="770" y="370" font-size="14" fill="#5ad1ff" font-family="ui-monospace, Menlo, monospace">AC8, AC10, AC13</text>

  <!-- Release 2 band -->
  <rect x="16" y="412" width="928" height="158" rx="8" fill="#8a96aa" fill-opacity="0.05" stroke="#8a96aa" stroke-dasharray="6,4"/>
  <text x="28" y="434" font-size="14" font-weight="700" fill="#8a96aa">RELEASE 2: NEXT</text>

  <rect x="24" y="446" width="172" height="114" rx="6" fill="none" stroke="#8a96aa" stroke-dasharray="5,4"/>
  <text x="34" y="470" font-size="14" fill="#e8edf5">Compare two</text>
  <text x="34" y="490" font-size="14" fill="#e8edf5">scenarios side</text>
  <text x="34" y="510" font-size="14" fill="#e8edf5">by side</text>
  <text x="34" y="532" font-size="14" fill="#8a96aa" font-family="ui-monospace, Menlo, monospace">Idea only</text>

  <rect x="208" y="446" width="172" height="114" rx="6" fill="none" stroke="#8a96aa" stroke-dasharray="5,4"/>
  <text x="218" y="470" font-size="14" fill="#e8edf5">Cleanview markers</text>
  <text x="218" y="490" font-size="14" fill="#e8edf5">on the globe, once</text>
  <text x="218" y="510" font-size="14" fill="#e8edf5">the licence allows</text>
  <text x="218" y="532" font-size="14" fill="#8a96aa" font-family="ui-monospace, Menlo, monospace">Gap: cv.map</text>

  <rect x="392" y="446" width="172" height="114" rx="6" fill="none" stroke="#8a96aa" stroke-dasharray="5,4"/>
  <text x="402" y="470" font-size="14" fill="#e8edf5">Water-stress scores</text>
  <text x="402" y="490" font-size="14" fill="#e8edf5">replace the desert</text>
  <text x="402" y="510" font-size="14" fill="#e8edf5">climate rule</text>
  <text x="402" y="532" font-size="14" fill="#8a96aa" font-family="ui-monospace, Menlo, monospace">Gap: a.water_rule</text>

  <rect x="760" y="446" width="172" height="114" rx="6" fill="none" stroke="#8a96aa" stroke-dasharray="5,4"/>
  <text x="770" y="470" font-size="14" fill="#e8edf5">Sourced upkeep and</text>
  <text x="770" y="490" font-size="14" fill="#e8edf5">off-world hardware</text>
  <text x="770" y="510" font-size="14" fill="#e8edf5">costs</text>
  <text x="770" y="532" font-size="14" fill="#8a96aa" font-family="ui-monospace, Menlo, monospace"><tspan x="770" dy="0">Gap: a.maint,</tspan><tspan x="770" dy="18">a.offworld_kit</tspan></text>

  <!-- Legend strip -->
  <line x1="24" y1="582" x2="936" y2="582" stroke="#263147" stroke-width="1"/>
  <text x="24" y="606" font-size="14" fill="#8a96aa">Solid card: built, with the acceptance criteria it meets (AC ids).</text>
  <text x="24" y="628" font-size="14" fill="#8a96aa">Dashed card: a known gap or idea, not built. Gap ids point at the sources list.</text>
</svg>
